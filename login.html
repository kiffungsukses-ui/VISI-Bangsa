<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login Pengelola - VISI Bangsa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #17212b;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 5px;
      color: #17212b;
    }

    .logo span {
      color: #e11d2e;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .role-choice {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .role-button {
      width: 100%;
      margin: 0;
      padding: 15px 16px;
      border: 1px solid #d9dee5;
      border-radius: 10px;
      background: #fff;
      color: #17212b;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .role-button:hover {
      border-color: #b40000;
      background: #fff8f8;
    }

    .role-button strong {
      display: block;
      font-size: 16px;
      margin-bottom: 3px;
    }

    .role-button span {
      display: block;
      color: #667085;
      font-size: 12px;
      font-weight: 500;
    }

    .login-form-wrap.hidden,
    .role-choice.hidden {
      display: none;
    }

    .selected-role {
      text-align: center;
      color: #b40000;
      font-size: 13px;
      font-weight: 800;
      margin: -5px 0 14px;
    }

    .change-role {
      display: block;
      margin: 0 auto 4px;
      border: 0;
      background: transparent;
      color: #667085;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #17212b;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #e11d2e;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #b42318;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      VISI <span>Bangsa</span>
    </div>

    <div class="subtitle">
      Login Pengelola
    </div>

    <div id="roleChoice" class="role-choice">
      <button type="button" class="role-button" data-role="admin">
        <strong>🔐 Admin</strong>
        <span>Kelola seluruh sistem dan pengaturan VISI Bangsa.</span>
      </button>

      <button type="button" class="role-button" data-role="redaksi">
        <strong>📰 Redaksi</strong>
        <span>Kelola berita, artikel, kiriman pengunjung, dan penerbitan.</span>
      </button>
    </div>

    <div id="loginFormWrap" class="login-form-wrap hidden">
      <div id="selectedRole" class="selected-role"></div>
      <button id="changeRoleButton" type="button" class="change-role">← Ganti pilihan</button>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button
        id="loginButton"
        type="submit"
      >
        Login
      </button>

      <div id="message"></div>

    </form>
    </div>

    <a
      class="back"
      href="./index.html"
    >
      ← Kembali ke VISI Bangsa
    </a>

  </div>


  <!-- Supabase harus dimuat SEBELUM kode login -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://vupvgdfdnpqactlqufbu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const form =
      document.getElementById("loginForm");

    const roleChoice =
      document.getElementById("roleChoice");

    const loginFormWrap =
      document.getElementById("loginFormWrap");

    const selectedRole =
      document.getElementById("selectedRole");

    const changeRoleButton =
      document.getElementById("changeRoleButton");

    let selectedLoginRole = "";

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    document.querySelectorAll("[data-role]").forEach(button => {
      button.addEventListener("click", () => {
        selectedLoginRole = button.dataset.role;
        selectedRole.textContent =
          selectedLoginRole === "admin"
            ? "Login sebagai ADMIN"
            : "Login sebagai REDAKSI";
        roleChoice.classList.add("hidden");
        loginFormWrap.classList.remove("hidden");
        message.textContent = "";
        document.getElementById("email").focus();
      });
    });

    changeRoleButton.addEventListener("click", () => {
      selectedLoginRole = "";
      loginFormWrap.classList.add("hidden");
      roleChoice.classList.remove("hidden");
      message.textContent = "";
      form.reset();
    });

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.textContent =
          "Sedang memeriksa akun...";

        loginButton.disabled = true;

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        try {

          const {
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (error) {

            console.error(error);

            message.textContent =
              "Login gagal. Periksa email dan password Anda.";

            loginButton.disabled = false;

            return;
          }

          const { data: userData } =
            await supabaseClient.auth.getUser();

          const user = userData && userData.user;
          const appRole =
            user && user.app_metadata && user.app_metadata.role;
          const userRole =
            user && user.user_metadata && user.user_metadata.role;

          // Akun lama tanpa role tetap diperlakukan sebagai Admin
          // agar fungsi login yang sudah berjalan tidak terputus.
          const actualRole =
            appRole || userRole || (user && user.email && user.email.toLowerCase() === "redaksivisbangsa@gmail.com" ? "redaksi" : "admin");

          if (selectedLoginRole !== actualRole) {
            await supabaseClient.auth.signOut();
            message.textContent =
              selectedLoginRole === "redaksi"
                ? "Akun ini belum terdaftar sebagai Redaksi."
                : "Akun ini bukan akun Admin.";
            loginButton.disabled = false;
            return;
          }

          sessionStorage.setItem(
            "visiBangsaLoginRole",
            actualRole
          );

          message.textContent =
            "Login berhasil. Membuka dashboard...";

          window.location.href =
            "./dashboard.html";


        } catch (error) {

          console.error(error);

          message.textContent =
            "Terjadi kesalahan. Silakan coba lagi.";

          loginButton.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
