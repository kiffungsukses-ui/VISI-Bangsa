<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Login pengelola VISI Bangsa">
  <meta name="theme-color" content="#17212b">

  <title>Login — VISI Bangsa</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="top">

  <div class="wrap mast">

    <a class="brand" href="./index.html">
      VISI <span>BANGSA</span>
    </a>

    <div class="tag">
      MEDIA ELEKTRONIK INDONESIA
    </div>

  </div>

  <nav class="nav">
    <div class="wrap navin">

      <a href="./index.html">Beranda</a>
      <a href="./berita.html">Berita</a>
      <a href="./nasional.html">Nasional</a>
      <a href="./ekonomi.html">Ekonomi</a>
      <a href="./daerah.html">Daerah</a>
      <a href="./tentang.html">Tentang</a>
      <a class="active" href="./login.html">Login</a>

    </div>
  </nav>

</header>


<main class="wrap">

  <section class="page">

    <p class="eyebrow">AREA PENGELOLA</p>

    <h1>Login</h1>

    <div class="article">

      <h2>Masuk ke VISI Bangsa</h2>

      <p>
        Gunakan email dan password akun pengelola
        untuk masuk ke dashboard.
      </p>

      <form id="loginForm">

        <p>
          <label for="email">Email</label><br>
          <input
            id="email"
            type="email"
            autocomplete="email"
            required
            style="width:100%;max-width:500px;padding:13px;margin-top:7px;"
          >
        </p>

        <p>
          <label for="password">Password</label><br>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            style="width:100%;max-width:500px;padding:13px;margin-top:7px;"
          >
        </p>

        <button
          type="submit"
          class="btn"
          style="border:0;cursor:pointer;"
        >
          Masuk →
        </button>

        <p id="message" aria-live="polite"></p>

      </form>

    </div>

  </section>

</main>


<footer>

  <div class="wrap foot">

    <strong>VISI BANGSA</strong>

    <span>
      © 2026 VISI Bangsa. Media Elektronik Indonesia.
    </span>

  </div>

</footer>


<script type="module">

  import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL =
    "https://vupvgdfdnpqactlqufbu.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    message.textContent = "Sedang memeriksa akun...";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const { error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      message.textContent =
        "Login gagal. Periksa email dan password Anda.";

      return;
    }

    window.location.href = "./dashboard.html";

  });

</script>

</body>
</html>
