<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>VISI Bangsa</title>
  <link rel="preload" as="image" href="https://vupvgdfdnpqactlqufbu.supabase.co/storage/v1/object/public/site-assets/486a84f6-5440-47e9-99c4-f9beac23b5d9/logo-1789834956033.png">

  <meta
    name="description"
    content="Berita terbaru dan informasi terkini dari VISI Bangsa."
  >

  <meta

    content="index, follow, max-image-preview:large"
  >

  <meta name="theme-color" content="#b40000">

  <link
    rel="icon"
    href="/favicon.ico"
  >

  <link
    id="canonical"
    rel="canonical"
    href="/"
  >

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="article"
  >

  <meta
    property="og:site_name"
    content="VISI Bangsa"
  >

  <meta
    id="ogTitle"
    property="og:title"
    content="VISI Bangsa"
  >

  <meta
    id="ogDescription"
    property="og:description"
    content="Berita terbaru dan informasi terkini dari VISI Bangsa."
  >

  <meta
    id="ogUrl"
    property="og:url"
    content="/"
  >

  <meta
    id="ogImage"
    property="og:image"
    content="/"
  >

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    id="twitterTitle"
    name="twitter:title"
    content="VISI Bangsa"
  >

  <meta
    id="twitterDescription"
    name="twitter:description"
    content="Berita terbaru dan informasi terkini dari VISI Bangsa."
  >

  <meta
    id="twitterImage"
    name="twitter:image"
    content="/"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #202124;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      background: #b40000;
      color: white;
      font-size: 13px;
      padding: 7px 20px;
    }

    .header {
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .site-logo { display:block; width:260px; max-width:65vw; height:auto; }

    .brand {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #b40000;
    }

    .brand span {
      color: #222;
    }

    .back {
      border: 1px solid #ddd;
      padding: 9px 15px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      background: white;
    }

    .back:hover {
      background: #f5f5f5;
    }

    .nav {
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .nav-inner {
      max-width: 1180px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      gap: 22px;
      overflow-x: auto;
    }

    .nav a {
      padding: 13px 0;
      white-space: nowrap;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .nav a:hover {
      color: #b40000;
    }

    main {
      max-width: 900px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }

    .breadcrumb {
      color: #777;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .breadcrumb a {
      color: #b40000;
      font-weight: bold;
    }

    .article {
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .category {
      display: inline-block;
      color: white;
      background: #b40000;
      padding: 6px 11px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 38px;
      line-height: 1.15;
      color: #171717;
    }

    .meta {
      color: #777;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.6;
    }

    .hero {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin-bottom: 25px;
      background: #eee;
    }

    .content {
      font-size: 18px;
      line-height: 1.8;
      color: #292929;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .share {
      border-top: 1px solid #eee;
      margin-top: 30px;
      padding-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .share button {
      border: 0;
      border-radius: 5px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      background: #eee;
    }

    .share button:hover {
      background: #ddd;
    }

    .related {
      margin-top: 30px;
    }

    .related h2 {
      font-size: 22px;
      border-left: 5px solid #b40000;
      padding-left: 10px;
    }

    .related-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .related-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .related-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .related-card div {
      padding: 12px;
    }

    .related-card h3 {
      font-size: 16px;
      line-height: 1.35;
      margin: 0;
    }

    .error {
      text-align: center;
      background: white;
      padding: 50px 20px;
      border-radius: 10px;
    }

    footer {
      background: #181818;
      color: #ddd;
      padding: 35px 20px;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .site-logo { width:220px; }

      .brand {
        font-size: 24px;
      }

      .header-inner {
        padding: 14px;
      }

      main {
        margin-top: 18px;
        padding: 0 12px;
      }

      .article {
        padding: 20px 16px;
      }

      h1 {
        font-size: 28px;
      }

      .content {
        font-size: 17px;
        line-height: 1.75;
      }

      .related-list {
        grid-template-columns: 1fr;
      }

      .related-card img {
        height: 190px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    Media Elektronik Indonesia
  </div>

  <header class="header">
    <div class="header-inner">

      <a href="/" aria-label="VISI Bangsa"><img id="siteLogo" class="site-logo" src="https://vupvgdfdnpqactlqufbu.supabase.co/storage/v1/object/public/site-assets/486a84f6-5440-47e9-99c4-f9beac23b5d9/logo-1789834956033.png" alt="VISI Bangsa — Media Elektronik Indonesia" style="visibility:hidden" onload="this.style.visibility='visible'"></a>

      <a
        class="back"
        href="/"
      >
        ← Beranda
      </a>

    </div>
  </header>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/">Beranda</a>
      <a href="/?kategori=Nasional">Nasional</a>
      <a href="/?kategori=Daerah">Daerah</a>
      <a href="/?kategori=Politik">Politik</a>
      <a href="/?kategori=Ekonomi">Ekonomi</a>
      <a href="/?kategori=Teknologi">Teknologi</a>
      <a href="/?kategori=Olahraga">Olahraga</a>
      <a href="/?kategori=Gaya Hidup">Gaya Hidup</a>
    </div>
  </nav>

  <main>

    <div class="breadcrumb">
      <a href="/">VISI Bangsa</a>
      &nbsp;›&nbsp;
      <span id="breadcrumbCategory">
        Berita
      </span>
      &nbsp;›&nbsp;
      <span id="breadcrumbTitle">
        Artikel
      </span>
    </div>

    <article
      class="article"
      id="article"
    >

      <div
        id="loading"
        style="text-align:center;padding:40px;"
      >
        Memuat berita...
      </div>

      <div id="articleContent" style="display:none;">

        <div
          class="category"
          id="category"
        >
          Berita
        </div>

        <h1 id="title">
          Memuat...
        </h1>

        <div
          class="meta"
          id="meta"
        ></div>

        <img
          id="hero"
          class="hero"
          alt=""
          style="display:none;"
        >

        <div
          class="content"
          id="content"
        ></div>

        <div class="share">

          <button
            type="button"
            id="shareButton"
          >
            Bagikan
          </button>

          <button
            type="button"
            id="copyButton"
          >
            Salin Link
          </button>

        </div>

      </div>

    </article>

    <section class="related">

      <h2>Berita Terkait</h2>

      <div
        class="related-list"
        id="relatedList"
      >
      </div>

    </section>

  </main>

  <footer>
    © <span id="year"></span> VISI Bangsa.
    Semua hak dilindungi.
  </footer>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://vupvgdfdnpqactlqufbu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    function getVisitorId() {
      try {
        const key = "visiBangsaVisitorId";
        let id = localStorage.getItem(key);
        if (!id) {
          id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2));
          localStorage.setItem(key, id);
        }
        return id;
      } catch {
        return "anonymous-" + Math.random().toString(36).slice(2);
      }
    }

    async function registerSiteVisit(path, newsId = null) {
      try {
        await supabaseClient.rpc("track_site_visit", {
          p_path: path,
          p_news_id: newsId ? String(newsId) : null,
          p_visitor_id: getVisitorId()
        });
      } catch (error) {
        console.warn("Statistik kunjungan tidak tercatat:", error);
      }
    }


    async function loadSiteLogo() {
      try {
        const { data, error } = await supabaseClient
          .from("site_settings")
          .select("logo_url")
          .eq("id", 1)
          .maybeSingle();
        if (error) throw error;
        const logo = document.getElementById("siteLogo");
        if (logo) logo.src = String(data?.logo_url || "https://vupvgdfdnpqactlqufbu.supabase.co/storage/v1/object/public/site-assets/486a84f6-5440-47e9-99c4-f9beac23b5d9/logo-1789834956033.png").trim();
      } catch (error) {
        console.warn("Logo situs menggunakan logo bawaan:", error);
      }
    }

    loadSiteLogo();

    const params =
      new URLSearchParams(
        window.location.search
      );

    const articleId =
      params.get("id");

    const titleElement =
      document.getElementById("title");

    const categoryElement =
      document.getElementById("category");

    const metaElement =
      document.getElementById("meta");

    const heroElement =
      document.getElementById("hero");

    const contentElement =
      document.getElementById("content");

    const loadingElement =
      document.getElementById("loading");

    const articleContent =
      document.getElementById("articleContent");

    const relatedList =
      document.getElementById("relatedList");

    const breadcrumbCategory =
      document.getElementById(
        "breadcrumbCategory"
      );

    const breadcrumbTitle =
      document.getElementById(
        "breadcrumbTitle"
      );

    document.getElementById("year")
      .textContent =
      new Date().getFullYear();

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {

      if (!value) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "id-ID",
        {
          dateStyle: "long",
          timeStyle: "short"
        }
      ).format(
        new Date(value)
      );
    }

    function makeDescription(text) {

      const clean =
        String(text ?? "")
          .replace(/\s+/g, " ")
          .trim();

      if (clean.length <= 160) {
        return clean;
      }

      return clean.substring(0, 157) + "...";
    }

    function updateSEO(article) {

      const title =
        article.judul ||
        "VISI Bangsa";

      const description =
        makeDescription(
          article.isi ||
          "Berita terbaru dan informasi terkini dari VISI Bangsa."
        );

      const url = window.location.href;

      const image = article.gambar
        ? new URL(article.gambar, window.location.origin).href
        : "";

      document.title =
        title +
        " | VISI Bangsa";

      document
        .querySelector(
          'meta[name="description"]'
        )
        .setAttribute(
          "content",
          description
        );

      document
        .getElementById("canonical")
        .setAttribute(
          "href",
          url
        );

      document
        .getElementById("ogTitle")
        .setAttribute(
          "content",
          title
        );

      document
        .getElementById("ogDescription")
        .setAttribute(
          "content",
          description
        );

      document
        .getElementById("ogUrl")
        .setAttribute(
          "content",
          url
        );

      document
        .getElementById("ogImage")
        .setAttribute(
          "content",
          image
        );

      document
        .getElementById("twitterTitle")
        .setAttribute(
          "content",
          title
        );

      document
        .getElementById("twitterDescription")
        .setAttribute(
          "content",
          description
        );

      document
        .getElementById("twitterImage")
        .setAttribute(
          "content",
          image
        );

      const schema = {

        "@context":
          "https://schema.org",

        "@type":
          "NewsArticle",

        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": url
        },

        "headline":
          title,

        "description":
          description,

        "image":
          image
            ? [image]
            : [],

        "datePublished":
          article.tanggal,

        "dateModified":
          article.updated_at ||
          article.tanggal,

        "author": {
          "@type":
            "Person",

          "name":
            article.penulis ||
            "Redaksi VISI Bangsa"
        },

        "publisher": {
          "@type":
            "Organization",

          "name":
            "VISI Bangsa",

          "url":
            window.location.origin + "/"
        },

        "articleSection":
          article.kategori ||
          "Berita",

        "isAccessibleForFree":
          true
      };

      const oldSchema =
        document.getElementById(
          "newsArticleSchema"
        );

      if (oldSchema) {
        oldSchema.remove();
      }

      const script =
        document.createElement(
          "script"
        );

      script.id =
        "newsArticleSchema";

      script.type =
        "application/ld+json";

      script.textContent =
        JSON.stringify(schema);

      document.head.appendChild(
        script
      );
    }

    async function registerArticleView(id) {
      if (!id) return;
      try {
        const { error } = await supabaseClient.rpc(
          "increment_news_view",
          { p_news_id: String(id) }
        );
        if (error) console.error("Gagal mencatat view:", error);
      } catch (error) {
        console.error("Gagal mencatat view:", error);
      }
    }

    async function loadArticle() {

      if (!articleId) {

        showError(
          "Berita tidak ditemukan."
        );

        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("berita")
          .select(
            "id,judul,isi,gambar,kategori,penulis,tanggal,status,updated_at"
          )
          .eq("id", articleId)
          .eq("status","terbit")
          .single();

      if (error || !data) {

        console.error(error);

        showError(
          "Berita tidak ditemukan."
        );

        return;
      }

      renderArticle(data);

      await registerSiteVisit(window.location.pathname, data.id);
      await registerArticleView(data.id);

      await loadRelated(
        data.kategori,
        data.id
      );
    }

    function renderArticle(article) {

      const category =
        article.kategori ||
        "Berita";

      categoryElement
        .textContent =
        category;

      titleElement
        .textContent =
        article.judul ||
        "Tanpa Judul";

      breadcrumbCategory
        .textContent =
        category;

      breadcrumbTitle
        .textContent =
        article.judul ||
        "Berita";

      const author =
        article.penulis ||
        "Redaksi VISI Bangsa";

      metaElement
        .textContent =
        "Oleh " +
        author +
        " • " +
        formatDate(
          article.tanggal
        );

      contentElement
        .textContent =
        article.isi ||
        "";

      if (article.gambar) {

        heroElement.src =
          article.gambar;

        heroElement.alt =
          article.judul ||
          "Foto berita VISI Bangsa";

        heroElement.style.display =
          "block";

      } else {

        heroElement.style.display =
          "none";
      }

      updateSEO(article);

      loadingElement.style.display =
        "none";

      articleContent.style.display =
        "block";
    }

    async function loadRelated(
      category,
      currentId
    ) {

      let query =
        supabaseClient
          .from("berita")
          .select(
            "id,judul,gambar,kategori,tanggal,status"
          )
          .eq("status","terbit")
          .neq(
            "id",
            currentId
          )
          .order(
            "tanggal",
            {
              ascending: false
            }
          )
          .limit(6);

      if (category) {

        query =
          query.eq(
            "kategori",
            category
          );
      }

      const {
        data,
        error
      } =
        await query;

      if (error) {

        console.error(error);

        return;
      }

      if (!data ||
          data.length === 0) {

        relatedList.innerHTML =
          "<p>Belum ada berita terkait.</p>";

        return;
      }

      relatedList.innerHTML =
        data.map(
          item => {

            const image =
              item.gambar ||
              "";

            return `
              <a
                class="related-card"
                href="/detail.html?id=${encodeURIComponent(item.id)}"
              >

                ${
                  image
                    ? `
                      <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(item.judul)}"
                        loading="lazy"
                      >
                    `
                    : ""
                }

                <div>

                  <h3>
                    ${escapeHtml(item.judul)}
                  </h3>

                </div>

              </a>
            `;
          }
        ).join("");
    }

    function showError(message) {

      loadingElement.style.display =
        "none";

      articleContent.style.display =
        "block";

      articleContent.innerHTML = `
        <div class="error">
          <h2>
            ${escapeHtml(message)}
          </h2>

          <p>
            Silakan kembali ke halaman utama.
          </p>

          <a
            class="back"
            href="/"
          >
            Kembali ke Beranda
          </a>
        </div>
      `;
    }

    document
      .getElementById("shareButton")
      .addEventListener(
        "click",
        async () => {

          const shareData = {

            title:
              document.title,

            text:
              titleElement.textContent,

            url:
              window.location.href
          };

          try {

            if (
              navigator.share
            ) {

              await navigator.share(
                shareData
              );

            } else {

              await navigator.clipboard.writeText(
                window.location.href
              );

              alert(
                "Link berita berhasil disalin."
              );
            }

          } catch (error) {

            console.log(error);
          }
        }
      );

    document
      .getElementById("copyButton")
      .addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard.writeText(
              window.location.href
            );

            alert(
              "Link berita berhasil disalin."
            );

          } catch (error) {

            alert(
              "Gagal menyalin link."
            );
          }
        }
      );

    loadArticle();
  </script>

</body>
</html>
