  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Domain publik resmi VISI Bangsa. Semua canonical, share, dan link distribusi
    // harus menggunakan domain ini, bukan hostname deployment Vercel.
    const PUBLIC_ORIGIN = "https://visibangsa.id";

    const SUPABASE_URL =
      "https://vupvgdfdnpqactlqufbu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    function getVisitorId() {
      try {
        const key = "visiBangsaVisitorId";
        let id = localStorage.getItem(key);
        if (!id) {
          id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2));
          localStorage.setItem(key, id);
        }
        return id;
      } catch {
        return "anonymous-" + Math.random().toString(36).slice(2);
      }
    }

    function getRadarAttribution() {
      try {
        const params = new URLSearchParams(window.location.search);
        const ref = document.referrer || "";
        let referrerHost = "";
        try { referrerHost = ref ? new URL(ref).hostname.replace(/^www\\./, "") : ""; } catch {}
        let source = params.get("utm_source") || "";
        if (!source && referrerHost) {
          if (/google\\./i.test(referrerHost)) source = "google";
          else if (/facebook\\.com$/i.test(referrerHost)) source = "facebook";
          else if (/instagram\\.com$/i.test(referrerHost)) source = "instagram";
          else if (/t\\.co$|twitter\\.com$/i.test(referrerHost)) source = "x";
          else if (/t\\.me$|telegram\\.me$/i.test(referrerHost)) source = "telegram";
          else if (/wa\\.me$|whatsapp\\.com$/i.test(referrerHost)) source = "whatsapp";
          else source = "referral";
        }
        if (!source) source = "direct";
        return {
          source: source.slice(0, 40),
          referrerHost: referrerHost.slice(0, 120),
          utmSource: (params.get("utm_source") || "").slice(0,120),
          utmMedium: (params.get("utm_medium") || "").slice(0,120),
          utmCampaign: (params.get("utm_campaign") || "").slice(0,120)
        };
      } catch {
        return {source:"direct",referrerHost:"",utmSource:"",utmMedium:"",utmCampaign:""};
      }
    }

    function getUserAgent() {
      try { return String(navigator.userAgent || "").slice(0, 500); }
      catch { return ""; }
    }

    async function loadSiteLogo() {
      try {
        const { data, error } = await supabaseClient
          .from("site_settings")
          .select("logo_url")
          .eq("id", 1)
          .maybeSingle();
        if (error) throw error;
        const logo = document.getElementById("siteLogo");
        if (logo) logo.src = String(data?.logo_url || "https://vupvgdfdnpqactlqufbu.supabase.co/storage/v1/object/public/site-assets/486a84f6-5440-47e9-99c4-f9beac23b5d9/logo-1789834956033.png").trim();
      } catch (error) {
        console.warn("Logo situs menggunakan logo bawaan:", error);
      }
    }

    loadSiteLogo();

    const params =
      new URLSearchParams(
        window.location.search
      );

    const articleId =
      params.get("id");

    const titleElement =
      document.getElementById("title");

    const categoryElement =
      document.getElementById("category");

    const metaElement =
      document.getElementById("meta");

    const updateNoteElement =
      document.getElementById("updateNote");

    const heroElement =
      document.getElementById("hero");

    const contentElement =
      document.getElementById("content");

    const loadingElement =
      document.getElementById("loading");

    const articleContent =
      document.getElementById("articleContent");

    const relatedList =
      document.getElementById("relatedList");

    const breadcrumbCategory =
      document.getElementById(
        "breadcrumbCategory"
      );

    const breadcrumbTitle =
      document.getElementById(
        "breadcrumbTitle"
      );

    document.getElementById("year")
      .textContent =
      new Date().getFullYear();

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {

      if (!value) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "id-ID",
        {
          dateStyle: "long",
          timeStyle: "short",
          timeZone: "Asia/Jakarta"
        }
      ).format(
        new Date(value)
      );
    }

    function makeDescription(text) {

      const clean =
        String(text ?? "")
          .replace(/\s+/g, " ")
          .trim();

      if (clean.length <= 160) {
        return clean;
      }

      return clean.substring(0, 157) + "...";
    }

    function updateSEO(article) {

      const title =
        article.judul ||
        "VISI Bangsa";

      const description =
        makeDescription(
          article.isi ||
          "Berita terbaru dan informasi terkini dari VISI Bangsa."
        );

      const url = new URL(PUBLIC_ORIGIN + "/detail.html");
      url.searchParams.set("id", String(article.id));
      const canonicalUrl = url.toString();

      const image = article.gambar
        ? new URL(article.gambar, PUBLIC_ORIGIN).href
        : "";

      document.title =
        title +
        " | VISI Bangsa";

      document
        .querySelector(
          'meta[name="description"]'
        )
        .setAttribute(
          "content",
          description
        );

      document
        .getElementById("canonical")
        .setAttribute(
          "href",
          canonicalUrl
        );

      document
        .getElementById("ogTitle")
        .setAttribute(
          "content",
          title
        );

      document
        .getElementById("ogDescription")
        .setAttribute(
          "content",
          description
        );

      document
        .getElementById("ogUrl")
        .setAttribute(
          "content",
          canonicalUrl
        );

      document
        .getElementById("ogImage")
        .setAttribute(
          "content",
          image
        );

      document
        .getElementById("twitterTitle")
        .setAttribute(
          "content",
          title
        );

      document
        .getElementById("twitterDescription")
        .setAttribute(
          "content",
          description
        );

      document
        .getElementById("twitterImage")
        .setAttribute(
          "content",
          image
        );

      document.getElementById("articlePublishedTime")?.setAttribute("content", article.tanggal || "");
      document.getElementById("articleModifiedTime")?.setAttribute("content", article.updated_at || article.tanggal || "");

      const schema = {

        "@context":
          "https://schema.org",

        "@type":
          "NewsArticle",

        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": canonicalUrl
        },

        "headline":
          title,

        "description":
          description,

        "image":
          image
            ? [image]
            : [],

        "datePublished":
          article.tanggal,

        "dateModified":
          article.updated_at ||
          article.tanggal,

        "author": {
          "@type":
            "Person",

          "name":
            article.penulis ||
            "Redaksi VISI Bangsa"
        },

        "publisher": {
          "@type":
            "Organization",

          "name":
            "VISI Bangsa",

          "url":
            PUBLIC_ORIGIN + "/"
        },

        "articleSection":
          article.kategori ||
          "Berita",

        "isAccessibleForFree":
          true
      };

      const oldSchema =
        document.getElementById(
          "newsArticleSchema"
        );

      if (oldSchema) {
        oldSchema.remove();
      }

      const script =
        document.createElement(
          "script"
        );

      script.id =
        "newsArticleSchema";

      script.type =
        "application/ld+json";

      script.textContent =
        JSON.stringify(schema);

      document.head.appendChild(
        script
      );

      const breadcrumbSchema = {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {"@type":"ListItem","position":1,"name":"VISI Bangsa","item":PUBLIC_ORIGIN+"/"},
          {"@type":"ListItem","position":2,"name":article.kategori || "Berita","item":PUBLIC_ORIGIN+"/?kategori="+encodeURIComponent(article.kategori || "")},
          {"@type":"ListItem","position":3,"name":title,"item":canonicalUrl}
        ]
      };
      const oldBreadcrumb = document.getElementById("breadcrumbSchema");
      if (oldBreadcrumb) oldBreadcrumb.remove();
      const breadcrumbScript = document.createElement("script");
      breadcrumbScript.id = "breadcrumbSchema";
      breadcrumbScript.type = "application/ld+json";
      breadcrumbScript.textContent = JSON.stringify(breadcrumbSchema);
      document.head.appendChild(breadcrumbScript);
    }

    async function registerArticleEntry(id, visitorId) {
      if (!id || !visitorId) return;
      try {
        const a = getRadarAttribution();
        let shareEventId = null;
        const shareToken = params.get("share_token");
        if (shareToken) {
          const { data: shareRow } = await supabaseClient
            .from("share_events")
            .select("id,news_id,share_token")
            .eq("share_token", shareToken)
            .eq("news_id", Number(id))
            .maybeSingle();
          if (shareRow?.id) shareEventId = shareRow.id;
        }
        const { data, error } = await supabaseClient.rpc("record_article_entry", {
          p_path: window.location.pathname,
          p_news_id: String(id),
          p_visitor_id: String(visitorId),
          p_source: a.source,
          p_referrer_host: a.referrerHost,
          p_utm_source: a.utmSource,
          p_utm_medium: a.utmMedium,
          p_utm_campaign: a.utmCampaign,
          p_user_agent: getUserAgent(),
          p_share_event_id: shareEventId
        });
        if (error) console.error("Gagal mencatat kunjungan/pembacaan:", error);
        return data;
      } catch (error) {
        console.error("Gagal mencatat kunjungan/pembacaan:", error);
        return null;
      }
    }

    async function loadArticle() {

      if (!articleId) {

        showError(
          "Berita tidak ditemukan."
        );

        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("berita")
          .select(
            "id,judul,isi,gambar,kategori,penulis,tanggal,status,updated_at"
          )
          .eq("id", articleId)
          .eq("status","terbit")
          .single();

      if (error || !data) {

        console.error(error);

        showError(
          "Berita tidak ditemukan."
        );

        return;
      }

      renderArticle(data);

      // Satu RPC atomik mencatat kunjungan website + pembacaan artikel.
      // Ini mencegah dua event terpisah menjadi tidak sinkron.
      const visitorId = getVisitorId();
      await registerArticleEntry(data.id, visitorId);

      await loadRelated(
        data.kategori,
        data.id
      );
    }

    function renderArticle(article) {

      const category =
        article.kategori ||
        "Berita";

      categoryElement
        .textContent =
        category;

      titleElement
        .textContent =
        article.judul ||
        "Tanpa Judul";

      breadcrumbCategory
        .textContent =
        category;

      breadcrumbTitle
        .textContent =
        article.judul ||
        "Berita";

      const author =
        article.penulis ||
        "Redaksi VISI Bangsa";

      metaElement
        .textContent =
        "Oleh " +
        author +
        " • Diterbitkan: " +
        formatDate(article.tanggal);

      if (updateNoteElement) {
        const published = new Date(article.tanggal);
        const updated = article.updated_at ? new Date(article.updated_at) : null;
        const hasUpdate =
          updated &&
          !Number.isNaN(updated.getTime()) &&
          !Number.isNaN(published.getTime()) &&
          updated.getTime() > published.getTime() + 1000;

        if (hasUpdate) {
          updateNoteElement.textContent =
            "Diperbarui: " + formatDate(article.updated_at);
          updateNoteElement.style.display = "block";
        } else {
          updateNoteElement.textContent = "";
          updateNoteElement.style.display = "none";
        }
      }

      contentElement
        .textContent =
        article.isi ||
        "";

      if (article.gambar) {

        heroElement.src =
          article.gambar;

        heroElement.alt =
          article.judul ||
          "Foto berita VISI Bangsa";

        heroElement.style.display =
          "block";

      } else {

        heroElement.style.display =
          "none";
      }

      updateSEO(article);

      loadingElement.style.display =
        "none";

      articleContent.style.display =
        "block";
    }

    async function loadRelated(
      category,
      currentId
    ) {

      let query =
        supabaseClient
          .from("berita")
          .select(
            "id,judul,gambar,kategori,tanggal,status"
          )
          .eq("status","terbit")
          .neq(
            "id",
            currentId
          )
          .order(
            "tanggal",
            {
              ascending: false
            }
          )
          .limit(6);

      if (category) {

        query =
          query.eq(
            "kategori",
            category
          );
      }

      const {
        data,
        error
      } =
        await query;

      if (error) {

        console.error(error);

        return;
      }

      if (!data ||
          data.length === 0) {

        relatedList.innerHTML =
          "<p>Belum ada berita terkait.</p>";

        return;
      }

      let relatedData = Array.isArray(data) ? [...data] : [];

      if (relatedData.length < 3) {
        const { data: fallbackData, error: fallbackError } = await supabaseClient
          .from("berita")
          .select("id,judul,gambar,kategori,tanggal,status")
          .eq("status", "terbit")
          .neq("id", currentId)
          .order("tanggal", { ascending: false })
          .limit(6);

        if (!fallbackError && Array.isArray(fallbackData)) {
          const seen = new Set(relatedData.map(item => String(item.id)));
          for (const item of fallbackData) {
            if (!seen.has(String(item.id)) && relatedData.length < 6) {
              relatedData.push(item);
              seen.add(String(item.id));
            }
          }
        }
      }

      if (relatedData.length === 0) {
        relatedList.innerHTML = "<p>Belum ada berita terkait.</p>";
        return;
      }

      relatedList.innerHTML =
        relatedData.map(
          item => {

            const image =
              item.gambar ||
              "";

            return `
              <a
                class="related-card"
                href="/detail.html?id=${encodeURIComponent(item.id)}"
              >

                ${
                  image
                    ? `
                      <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(item.judul)}"
                        loading="lazy"
                      >
                    `
                    : ""
                }

                <div>

                  <h3>
                    ${escapeHtml(item.judul)}
                  </h3>

                </div>

              </a>
            `;
          }
        ).join("");
    }

    function showError(message) {

      loadingElement.style.display =
        "none";

      articleContent.style.display =
        "block";

      articleContent.innerHTML = `
        <div class="error">
          <h2>
            ${escapeHtml(message)}
          </h2>

          <p>
            Silakan kembali ke halaman utama.
          </p>

          <a
            class="back"
            href="/"
          >
            Kembali ke Beranda
          </a>
        </div>
      `;
    }

    async function logShare(channel) {
      try {
        const { data, error } = await supabaseClient
          .from("share_events")
          .insert({
            news_id: articleId ? Number(articleId) : null,
            channel: channel,
            visitor_id: getVisitorId(),
            path: window.location.pathname + window.location.search
          })
          .select("id,share_token")
          .single();
        if (error) throw error;
        return data;
      } catch (error) {
        console.warn("Pencatatan share tidak mengganggu proses berbagi:", error);
        return null;
      }
    }

    function makeArticleSlug(title) {
      return String(title || "")
        .toLowerCase()
        .normalize("NFD").replace(/[\\u0300-\\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 110);
    }

    function makeTrackedShareUrl(source, shareToken) {
      const slug = makeArticleSlug(titleElement.textContent.trim());
      const url = new URL(PUBLIC_ORIGIN + "/" + slug);
      if (source && shareToken) {
        url.searchParams.set("utm_source", source);
        url.searchParams.set("utm_medium", "share");
        url.searchParams.set("utm_campaign", "berita");
        url.searchParams.set("share_token", String(shareToken));
      }
      return url.toString();
    }

    function openSocialShare(channel) {
      const title = titleElement.textContent.trim() || document.title;
      const text = title + " — VISI Bangsa";
      if (!["whatsapp","telegram","facebook","x"].includes(channel)) return;

      logShare(channel).then((share) => {
        const trackedUrl = makeTrackedShareUrl(channel, share?.share_token);
        const encodedText = encodeURIComponent(text);
        const links = {
          whatsapp: "https://wa.me/?text=" + encodeURIComponent(text + "\n" + trackedUrl),
          telegram: "https://t.me/share/url?url=" + encodeURIComponent(trackedUrl) + "&text=" + encodedText,
          facebook: "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(trackedUrl),
          x: "https://twitter.com/intent/tweet?text=" + encodedText + "&url=" + encodeURIComponent(trackedUrl)
        };
        if (!links[channel]) return;
        window.open(links[channel], "_blank", "noopener,noreferrer");
      });
    }

    document.querySelectorAll(".social-share").forEach((button) => {
      button.addEventListener("click", () => {
        openSocialShare(button.dataset.channel);
      });
    });

    document
      .getElementById("shareButton")
      .addEventListener(
        "click",
        async () => {
          try {
            const share = await logShare("share");
            const trackedUrl = makeTrackedShareUrl("share", share?.share_token);
            const shareData = {
              title: document.title,
              text: titleElement.textContent,
              url: trackedUrl
            };

            if (navigator.share) {
              await navigator.share(shareData);
            } else {
              await navigator.clipboard.writeText(trackedUrl);
              alert("Link berita berhasil disalin.");
            }
          } catch (error) {
            console.log(error);
          }
        }
      );

    document
      .getElementById("copyButton")
      .addEventListener(
        "click",
        async () => {
          try {
            const share = await logShare("copy");
            const copyUrl = makeTrackedShareUrl("copy", share?.share_token);
            await navigator.clipboard.writeText(copyUrl);
            alert("Link berita berhasil disalin.");
          } catch (error) {
            alert("Gagal menyalin link.");
          }
        }
      );

    loadArticle();
  </script>
