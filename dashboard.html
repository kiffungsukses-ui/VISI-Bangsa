        await supabase.auth.signOut();

      if (error) {

        logoutButton.disabled = false;
        logoutButton.textContent =
          "Keluar";

        message.textContent =
          "Gagal keluar. Silakan coba lagi.";

        return;
      }

      window.location.href =
        "./login.html";
    }
  );


  checkLogin();

</script>

</html>
