<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dashboard — VISI Bangsa</title>

  <meta
    name="description"
    content="Dashboard pengelolaan berita VISI Bangsa"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f7;
      color: #17212b;
    }

    header {
      background: #17212b;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
    }

    .brand span {
      color: #e21d2f;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-label {
      font-size: 13px;
      opacity: .85;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout {
      background: #e21d2f;
      color: white;
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .welcome h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .welcome p {
      margin: 0;
      color: #66717d;
    }

    .grid {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 20px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d5dbe1;
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #e21d2f;
      box-shadow: 0 0 0 2px rgba(226,29,47,.1);
    }

    .image-box {
      border: 2px dashed #cfd6dd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      background: #fafbfc;
    }

    .image-box input {
      border: 0;
      padding: 5px;
      background: transparent;
    }

    .preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 9px;
      margin-top: 12px;
      display: none;
    }

    .current-image {
      margin-top: 10px;
      font-size: 12px;
      color: #68737e;
      word-break: break-all;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .primary {
      background: #e21d2f;
      color: white;
      flex: 1;
    }

    .secondary {
      background: #e9edf1;
      color: #17212b;
    }

    .message {
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #e8f7ed;
      color: #176b37;
    }

    .error {
      display: block;
      background: #fdebed;
      color: #a51e2d;
    }

    .loading {
      display: block;
      background: #eef3f8;
      color: #43515e;
    }

    .berita-item {
      border-bottom: 1px solid #e4e8ec;
      padding: 16px 0;
    }

    .berita-item:first-child {
      padding-top: 0;
    }

    .berita-item:last-child {
      border-bottom: 0;
    }

    .berita-flex {
      display: flex;
      gap: 15px;
    }

    .thumb {
      width: 130px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      background: #e7ebef;
      flex-shrink: 0;
    }

    .berita-content {
      flex: 1;
    }

    .berita-title {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .meta {
      color: #707b86;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .edit {
      background: #17212b;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
    }

    .delete {
      background: #f3dadd;
      color: #a51e2d;
      padding: 8px 12px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #727d87;
    }

    .site-link {
      display: inline-block;
      margin-top: 12px;
      color: #e21d2f;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 13px 15px;
      }

      .brand {
        font-size: 19px;
      }

      .admin-label {
        display: none;
      }

      .card {
        padding: 16px;
      }

      .berita-flex {
        align-items: flex-start;
      }

      .thumb {
        width: 95px;
        height: 75px;
      }

      .berita-title {
        font-size: 15px;
      }

      .form-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    VISI <span>Bangsa</span>
  </div>

  <div class="header-right">
    <div class="admin-label" id="adminEmail">
      Memeriksa akun...
    </div>

    <button class="logout" id="logoutButton">
      Keluar
    </button>
  </div>
</header>

<main>

  <section class="welcome">
    <h1>Dashboard Pengelola Berita</h1>

    <p>
      Tambahkan, edit, hapus, dan kelola berita VISI Bangsa.
    </p>

    <a
      class="site-link"
      href="https://visi-bangsa.vercel.app/"
      target="_blank"
    >
      Buka Website VISI Bangsa →
    </a>
  </section>

  <section class="grid">

    <!-- FORM -->
    <div class="card">

      <h2 id="formTitle">
        Tambah Berita
      </h2>

      <form id="beritaForm">

        <input
          type="hidden"
          id="beritaId"
        >

        <label for="judul">
          Judul Berita
        </label>

        <input
          id="judul"
          type="text"
          placeholder="Masukkan judul berita"
          required
        >

        <label for="kategori">
          Kategori
        </label>

        <select id="kategori">
          <option value="Nasional">Nasional</option>
          <option value="Daerah">Daerah</option>
          <option value="Politik">Politik</option>
          <option value="Ekonomi">Ekonomi</option>
          <option value="Teknologi">Teknologi</option>
          <option value="Pendidikan">Pendidikan</option>
          <option value="Kesehatan">Kesehatan</option>
          <option value="Olahraga">Olahraga</option>
          <option value="Hukum">Hukum</option>
          <option value="Lifestyle">Lifestyle</option>
        </select>

        <label for="penulis">
          Penulis
        </label>

        <input
          id="penulis"
          type="text"
          value="Redaksi VISI Bangsa"
          required
        >

        <label for="tanggal">
          Tanggal
        </label>

        <input
          id="tanggal"
          type="datetime-local"
          required
        >

        <label>
          Gambar Berita
        </label>

        <div class="image-box">

          <div>
            Pilih gambar dari HP
          </div>

          <input
            id="gambarFile"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
          >

          <img
            id="preview"
            class="preview"
            alt="Preview gambar"
          >

          <div
            id="currentImage"
            class="current-image"
          ></div>

        </div>

        <label for="isi">
          Isi Berita
        </label>

        <textarea
          id="isi"
          placeholder="Tulis isi berita..."
          required
        ></textarea>

        <div class="form-actions">

          <button
            class="primary"
            id="submitButton"
            type="submit"
          >
            Publikasikan Berita
          </button>

          <button
            class="secondary"
            id="cancelButton"
            type="button"
            style="display:none"
          >
            Batal Edit
          </button>

        </div>

        <div
          id="message"
          class="message"
        ></div>

      </form>

    </div>


    <!-- DAFTAR BERITA -->
    <div class="card">

      <h2>
        Daftar Berita
      </h2>

      <div id="beritaList">
        Memuat berita...
      </div>

    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://vupvgdfdnpqactlqufbu.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const beritaForm =
  document.getElementById("beritaForm");

const beritaId =
  document.getElementById("beritaId");

const judul =
  document.getElementById("judul");

const kategori =
  document.getElementById("kategori");

const penulis =
  document.getElementById("penulis");

const tanggal =
  document.getElementById("tanggal");

const isi =
  document.getElementById("isi");

const gambarFile =
  document.getElementById("gambarFile");

const preview =
  document.getElementById("preview");

const currentImage =
  document.getElementById("currentImage");

const beritaList =
  document.getElementById("beritaList");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");

const cancelButton =
  document.getElementById("cancelButton");

const formTitle =
  document.getElementById("formTitle");

const logoutButton =
  document.getElementById("logoutButton");

const adminEmail =
  document.getElementById("adminEmail");


let currentSession = null;
let currentImageUrl = "";


/* =========================
   PESAN
========================= */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================
   TANGGAL
========================= */

function setDefaultDate() {

  const now = new Date();

  now.setMinutes(
    now.getMinutes() -
    now.getTimezoneOffset()
  );

  tanggal.value =
    now.toISOString().slice(0,16);

}


/* =========================
   CEK LOGIN
========================= */

async function cekLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if (error || !data.session) {

    window.location.href =
      "/login.html";

    return false;

  }

  currentSession =
    data.session;

  adminEmail.textContent =
    data.session.user.email || "Admin";

  return true;
}


/* =========================
   LOAD BERITA
========================= */

async function loadBerita() {

  beritaList.innerHTML =
    "Memuat berita...";

  const {
    data,
    error
  } =
    await supabaseClient
      .from("berita")
      .select("*")
      .order("tanggal", {
        ascending: false
      });

  if (error) {

    beritaList.innerHTML =
      `<div class="empty">
        Gagal memuat berita:<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  if (!data || data.length === 0) {

    beritaList.innerHTML =
      `<div class="empty">
        Belum ada berita.
      </div>`;

    return;
  }

  beritaList.innerHTML =
    data.map(renderBerita).join("");

}


/* =========================
   RENDER BERITA
========================= */

function renderBerita(item) {

  const gambar =
    item.gambar ||
    "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80";

  const date =
    item.tanggal
      ? new Date(item.tanggal).toLocaleString(
          "id-ID",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        )
      : "-";

  return `
    <div class="berita-item">

      <div class="berita-flex">

        <img
          class="thumb"
          src="${escapeAttribute(gambar)}"
          alt=""
          onerror="this.style.display='none'"
        >

        <div class="berita-content">

          <div class="berita-title">
            ${escapeHtml(item.judul)}
          </div>

          <div class="meta">
            ${escapeHtml(item.kategori || "-")}
            •
            ${escapeHtml(item.penulis || "-")}
            •
            ${escapeHtml(date)}
          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="editBerita(${item.id})"
            >
              Edit
            </button>

            <button
              class="delete"
              onclick="hapusBerita(${item.id})"
            >
              Hapus
            </button>

          </div>

        </div>

      </div>

    </div>
  `;

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* =========================
   PREVIEW GAMBAR
========================= */

gambarFile.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];

    if (!file) {

      preview.style.display =
        "none";

      return;
    }

    if (!file.type.startsWith("image/")) {

      showMessage(
        "File harus berupa gambar.",
        "error"
      );

      this.value = "";

      return;
    }

    if (file.size > 5 * 1024 * 1024) {

      showMessage(
        "Ukuran gambar maksimal 5 MB.",
        "error"
      );

      this.value = "";

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function (event) {

        preview.src =
          event.target.result;

        preview.style.display =
          "block";

      };

    reader.readAsDataURL(file);

  }
);


/* =========================
   UPLOAD GAMBAR
========================= */

async function uploadGambar(file) {

  if (!file) {
    return currentImageUrl || null;
  }

  if (!file.type.startsWith("image/")) {

    throw new Error(
      "File yang dipilih bukan gambar."
    );

  }

  if (file.size > 5 * 1024 * 1024) {

    throw new Error(
      "Ukuran gambar maksimal 5 MB."
    );

  }

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const safeExtension =
    extension.replace(
      /[^a-z0-9]/g,
      ""
    ) || "jpg";

  const userId =
    currentSession.user.id;

  const filePath =
    userId +
    "/" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10) +
    "." +
    safeExtension;


  showMessage(
    "Mengunggah gambar...",
    "loading"
  );


  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from("berita")
      .upload(
        filePath,
        file,
        {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        }
      );


  if (uploadError) {

    throw new Error(
      "Upload gambar gagal: " +
      uploadError.message
    );

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("berita")
      .getPublicUrl(filePath);


  if (!data || !data.publicUrl) {

    throw new Error(
      "URL gambar tidak berhasil dibuat."
    );

  }

  return data.publicUrl;

}


/* =========================
   SUBMIT FORM
========================= */

beritaForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    submitButton.disabled = true;

    cancelButton.disabled = true;

    showMessage(
      "Memproses berita...",
      "loading"
    );


    try {

      const id =
        beritaId.value;

      const file =
        gambarFile.files[0];


      let gambarUrl =
        currentImageUrl || null;


      if (file) {

        gambarUrl =
          await uploadGambar(file);

      }


      const payload = {

        judul:
          judul.value.trim(),

        kategori:
          kategori.value,

        penulis:
          penulis.value.trim(),

        tanggal:
          tanggal.value
            ? new Date(
                tanggal.value
              ).toISOString()
            : new Date().toISOString(),

        isi:
          isi.value.trim(),

        gambar:
          gambarUrl

      };


      let result;


      if (id) {

        result =
          await supabaseClient
            .from("berita")
            .update(payload)
            .eq("id", id);

      } else {

        result =
          await supabaseClient
            .from("berita")
            .insert(payload);

      }


      if (result.error) {

        throw new Error(
          result.error.message
        );

      }


      showMessage(
        id
          ? "Berita berhasil diperbarui."
          : "Berita berhasil dipublikasikan.",
        "success"
      );


      resetForm();

      await loadBerita();


    } catch (error) {

      console.error(error);

      showMessage(
        "Gagal: " +
        error.message,
        "error"
      );

    } finally {

      submitButton.disabled = false;

      cancelButton.disabled = false;

    }

  }
);


/* =========================
   EDIT BERITA
========================= */

async function editBerita(id) {

  showMessage(
    "Memuat berita...",
    "loading"
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("berita")
      .select("*")
      .eq("id", id)
      .single();


  if (error) {

    showMessage(
      "Gagal memuat berita: " +
      error.message,
      "error"
    );

    return;
  }


  beritaId.value =
    data.id;

  judul.value =
    data.judul || "";

  kategori.value =
    data.kategori || "Nasional";

  penulis.value =
    data.penulis ||
    "Redaksi VISI Bangsa";

  isi.value =
    data.isi || "";

  currentImageUrl =
    data.gambar || "";


  if (data.tanggal) {

    const d =
      new Date(data.tanggal);

    d.setMinutes(
      d.getMinutes() -
      d.getTimezoneOffset()
    );

    tanggal.value =
      d.toISOString()
        .slice(0,16);

  } else {

    setDefaultDate();

  }


  gambarFile.value = "";

  if (data.gambar) {

    preview.src =
      data.gambar;

    preview.style.display =
      "block";

    currentImage.innerHTML =
      "Gambar saat ini tersimpan. Pilih gambar baru jika ingin menggantinya.";

  } else {

    preview.style.display =
      "none";

    currentImage.innerHTML =
      "";

  }


  formTitle.textContent =
    "Edit Berita";

  submitButton.textContent =
    "Simpan Perubahan";

  cancelButton.style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   HAPUS BERITA
========================= */

async function hapusBerita(id) {

  const yakin =
    confirm(
      "Apakah Anda yakin ingin menghapus berita ini?"
    );

  if (!yakin) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("berita")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Gagal menghapus berita:\n" +
      error.message
    );

    return;
  }


  await loadBerita();

}


/* =========================
   RESET FORM
========================= */

function resetForm() {

  beritaForm.reset();

  beritaId.value =
    "";

  currentImageUrl =
    "";

  formTitle.textContent =
    "Tambah Berita";

  submitButton.textContent =
    "Publikasikan Berita";

  cancelButton.style.display =
    "none";

  preview.src =
    "";

  preview.style.display =
    "none";

  currentImage.textContent =
    "";

  penulis.value =
    "Redaksi VISI Bangsa";

  setDefaultDate();

  message.className =
    "message";

  message.textContent =
    "";

}


/* =========================
   BATAL EDIT
========================= */

cancelButton.addEventListener(
  "click",
  function () {

    resetForm();

  }
);


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
  "click",
  async function () {

    logoutButton.disabled =
      true;

    const {
      error
    } =
      await supabaseClient
        .auth
        .signOut();

    if (error) {

      alert(
        "Gagal keluar: " +
        error.message
      );

      logoutButton.disabled =
        false;

      return;
    }

    window.location.href =
      "/login.html";

  }
);


/* =========================
   MULAI DASHBOARD
========================= */

(async function () {

  const loggedIn =
    await cekLogin();

  if (!loggedIn) {
    return;
  }

  setDefaultDate();

  await loadBerita();

})();

</script>

</body>
</html>
