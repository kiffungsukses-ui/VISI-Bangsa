<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dashboard — VISI Bangsa</title>
  <meta name="description" content="Dashboard pengelolaan berita VISI Bangsa">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #202124;
    }

    header {
      background: #b40000;
      color: white;
      padding: 15px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .brand small {
      display: block;
      font-size: 11px;
      font-weight: normal;
      margin-top: 3px;
    }

    button,
    .button {
      border: 0;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .logout {
      background: white;
      color: #b40000;
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 5px solid #b40000;
    }

    .welcome h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .welcome p {
      margin: 0;
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin: 15px 0 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 11px;
      font-family: inherit;
      font-size: 14px;
      background: white;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .primary {
      width: 100%;
      margin-top: 18px;
      background: #b40000;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .danger {
      background: #b40000;
      color: white;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 5px;
      display: none;
      font-size: 13px;
    }

    .success {
      background: #e7f6ec;
      color: #176b35;
    }

    .error {
      background: #fdeaea;
      color: #9b1c1c;
    }

    .berita-list {
      display: grid;
      gap: 15px;
    }

    .berita {
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 15px;
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 15px;
    }

    .berita img,
    .no-image {
      width: 130px;
      height: 95px;
      object-fit: cover;
      border-radius: 5px;
      background: #eee;
    }

    .no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
      text-align: center;
    }

    .berita h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .meta {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .excerpt {
      color: #555;
      font-size: 13px;
      line-height: 1.4;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions button {
      padding: 7px 11px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        align-items: flex-start;
      }

      .brand {
        font-size: 20px;
      }

      .berita {
        grid-template-columns: 1fr;
      }

      .berita img,
      .no-image {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      VISI Bangsa
      <small>Dashboard Pengelola Berita</small>
    </div>

    <button id="logoutButton" class="logout">
      Keluar
    </button>
  </div>
</header>

<main>

  <section class="welcome">
    <h1>Kelola Berita</h1>
    <p>
      Tambahkan, edit, atau hapus berita VISI Bangsa.
      Berita yang dipublikasikan akan tampil di website publik.
    </p>
  </section>

  <section class="grid">

    <!-- FORM -->
    <div class="card">

      <h2 id="formTitle">Tambah Berita</h2>

      <form id="beritaForm">

        <input type="hidden" id="beritaId">

        <label for="judul">
          Judul Berita
        </label>

        <input
          id="judul"
          type="text"
          placeholder="Masukkan judul berita"
          required
        >

        <label for="kategori">
          Kategori
        </label>

        <select id="kategori">
          <option value="Nasional">Nasional</option>
          <option value="Daerah">Daerah</option>
          <option value="Ekonomi">Ekonomi</option>
          <option value="Politik">Politik</option>
          <option value="Olahraga">Olahraga</option>
          <option value="Teknologi">Teknologi</option>
          <option value="Pendidikan">Pendidikan</option>
          <option value="Kesehatan">Kesehatan</option>
          <option value="Hukum">Hukum</option>
          <option value="Lainnya">Lainnya</option>
        </select>

        <label for="penulis">
          Penulis
        </label>

        <input
          id="penulis"
          type="text"
          placeholder="Nama penulis"
          value="Redaksi VISI Bangsa"
          required
        >

        <label for="tanggal">
          Tanggal
        </label>

        <input
          id="tanggal"
          type="datetime-local"
          required
        >

        <label for="gambar">
          URL Gambar
        </label>

        <input
          id="gambar"
          type="url"
          placeholder="https://..."
        >

        <label for="isi">
          Isi Berita
        </label>

        <textarea
          id="isi"
          placeholder="Tulis isi berita di sini..."
          required
        ></textarea>

        <button
          id="submitButton"
          type="submit"
          class="primary"
        >
          Publikasikan Berita
        </button>

        <button
          id="cancelButton"
          type="button"
          class="secondary"
          style="display:none;width:100%;margin-top:8px;"
        >
          Batal Edit
        </button>

        <div id="message" class="message"></div>

      </form>

    </div>

    <!-- DAFTAR BERITA -->
    <div class="card">

      <h2>Daftar Berita</h2>

      <div id="beritaList" class="berita-list">
        <div class="loading">
          Memuat berita...
        </div>
      </div>

    </div>

  </section>

</main>

<script>

  /*
   * ============================
   * KONFIGURASI SUPABASE
   * ============================
   */

  const SUPABASE_URL =
    "https://vupvgdfdnpqactlqufbu.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /*
   * ============================
   * ELEMENT
   * ============================
   */

  const form =
    document.getElementById("beritaForm");

  const beritaId =
    document.getElementById("beritaId");

  const judul =
    document.getElementById("judul");

  const kategori =
    document.getElementById("kategori");

  const penulis =
    document.getElementById("penulis");

  const tanggal =
    document.getElementById("tanggal");

  const gambar =
    document.getElementById("gambar");

  const isi =
    document.getElementById("isi");

  const beritaList =
    document.getElementById("beritaList");

  const message =
    document.getElementById("message");

  const submitButton =
    document.getElementById("submitButton");

  const cancelButton =
    document.getElementById("cancelButton");

  const formTitle =
    document.getElementById("formTitle");

  const logoutButton =
    document.getElementById("logoutButton");


  /*
   * ============================
   * TANGGAL DEFAULT
   * ============================
   */

  function setTanggalSekarang() {

    const now = new Date();

    now.setMinutes(
      now.getMinutes() -
      now.getTimezoneOffset()
    );

    tanggal.value =
      now.toISOString().slice(0,16);
  }

  setTanggalSekarang();


  /*
   * ============================
   * MESSAGE
   * ============================
   */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

    setTimeout(() => {
      message.style.display = "none";
    }, 5000);
  }


  /*
   * ============================
   * FORMAT TANGGAL
   * ============================
   */

  function formatTanggal(value) {

    if (!value) return "-";

    return new Date(value).toLocaleString(
      "id-ID",
      {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  /*
   * ============================
   * POTONG TEKS
   * ============================
   */

  function potong(text, length = 180) {

    if (!text) return "";

    const clean =
      text.replace(/<[^>]*>/g, "");

    if (clean.length <= length) {
      return clean;
    }

    return clean.substring(0, length) + "...";
  }


  /*
   * ============================
   * LOAD BERITA
   * ============================
   */

  async function loadBerita() {

    beritaList.innerHTML =
      '<div class="loading">Memuat berita...</div>';

    const {
      data,
      error
    } = await supabaseClient
      .from("berita")
      .select("*")
      .order("tanggal", {
        ascending: false
      });

    if (error) {

      console.error(error);

      beritaList.innerHTML =
        `<div class="empty">
          Gagal mengambil berita.<br>
          ${error.message}
        </div>`;

      return;
    }

    if (!data || data.length === 0) {

      beritaList.innerHTML =
        `<div class="empty">
          Belum ada berita.
        </div>`;

      return;
    }

    beritaList.innerHTML = "";

    data.forEach(item => {

      const article =
        document.createElement("div");

      article.className = "berita";

      const image =
        item.gambar
          ? `<img src="${item.gambar}" alt="${item.judul}">`
          : `<div class="no-image">Tidak ada gambar</div>`;

      article.innerHTML = `

        <div>
          ${image}
        </div>

        <div>

          <h3>
            ${item.judul || "Tanpa judul"}
          </h3>

          <div class="meta">
            ${item.kategori || "Umum"}
            ·
            ${item.penulis || "Redaksi VISI Bangsa"}
            ·
            ${formatTanggal(item.tanggal || item.created_at)}
          </div>

          <div class="excerpt">
            ${potong(item.isi)}
          </div>

          <div class="actions">

            <button
              class="secondary"
              onclick="editBerita('${item.id}')"
            >
              Edit
            </button>

            <button
              class="danger"
              onclick="hapusBerita('${item.id}')"
            >
              Hapus
            </button>

          </div>

        </div>
      `;

      beritaList.appendChild(article);
    });
  }


  /*
   * ============================
   * TAMBAH / EDIT BERITA
   * ============================
   */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      submitButton.disabled = true;

      const dataBerita = {

        judul:
          judul.value.trim(),

        isi:
          isi.value.trim(),

        gambar:
          gambar.value.trim() || null,

        kategori:
          kategori.value,

        penulis:
          penulis.value.trim(),

        tanggal:
          tanggal.value
            ? new Date(tanggal.value).toISOString()
            : new Date().toISOString()
      };


      try {

        /*
         * EDIT
         */

        if (beritaId.value) {

          const {
            error
          } = await supabaseClient
            .from("berita")
            .update(dataBerita)
            .eq("id", beritaId.value);

          if (error) {
            throw error;
          }

          showMessage(
            "Berita berhasil diperbarui.",
            "success"
          );

        }

        /*
         * TAMBAH
         */

        else {

          const {
            error
          } = await supabaseClient
            .from("berita")
            .insert([dataBerita]);

          if (error) {
            throw error;
          }

          showMessage(
            "Berita berhasil dipublikasikan.",
            "success"
          );
        }


        resetForm();

        await loadBerita();

      }

      catch (error) {

        console.error(error);

        showMessage(
          "Gagal menyimpan berita: " +
          error.message,
          "error"
        );

      }

      finally {

        submitButton.disabled = false;

      }

    }
  );


  /*
   * ============================
   * EDIT
   * ============================
   */

  window.editBerita =
    async function(id) {

      const {
        data,
        error
      } = await supabaseClient
        .from("berita")
        .select("*")
        .eq("id", id)
        .single();

      if (error) {

        showMessage(
          "Gagal mengambil berita: " +
          error.message,
          "error"
        );

        return;
      }

      beritaId.value =
        data.id;

      judul.value =
        data.judul || "";

      isi.value =
        data.isi || "";

      gambar.value =
        data.gambar || "";

      kategori.value =
        data.kategori || "Nasional";

      penulis.value =
        data.penulis || "Redaksi VISI Bangsa";

      if (data.tanggal) {

        const d =
          new Date(data.tanggal);

        d.setMinutes(
          d.getMinutes() -
          d.getTimezoneOffset()
        );

        tanggal.value =
          d.toISOString().slice(0,16);
      }

      formTitle.textContent =
        "Edit Berita";

      submitButton.textContent =
        "Simpan Perubahan";

      cancelButton.style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };


  /*
   * ============================
   * HAPUS
   * ============================
   */

  window.hapusBerita =
    async function(id) {

      const yakin =
        confirm(
          "Apakah Anda yakin ingin menghapus berita ini?"
        );

      if (!yakin) {
        return;
      }

      const {
        error
      } = await supabaseClient
        .from("berita")
        .delete()
        .eq("id", id);

      if (error) {

        showMessage(
          "Gagal menghapus berita: " +
          error.message,
          "error"
        );

        return;
      }

      showMessage(
        "Berita berhasil dihapus.",
        "success"
      );

      await loadBerita();
    };


  /*
   * ============================
   * RESET FORM
   * ============================
   */

  function resetForm() {

    form.reset();

    beritaId.value = "";

    formTitle.textContent =
      "Tambah Berita";

    submitButton.textContent =
      "Publikasikan Berita";

    cancelButton.style.display =
      "none";

    penulis.value =
      "Redaksi VISI Bangsa";

    setTanggalSekarang();
  }


  cancelButton.addEventListener(
    "click",
    resetForm
  );


  /*
   * ============================
   * LOGOUT
   * ============================
   */

  logoutButton.addEventListener(
    "click",
    async function() {

      logoutButton.disabled = true;

      const {
        error
      } =
        await supabaseClient.auth.signOut();

      if (error) {

        console.error(error);

        showMessage(
          "Gagal keluar: " +
          error.message,
          "error"
        );

        logoutButton.disabled = false;

        return;
      }

      window.location.href =
        "login.html";
    }
  );


  /*
   * ============================
   * CEK LOGIN
   * ============================
   */

  async function cekLogin() {

    const {
      data
    } =
      await supabaseClient.auth.getSession();

    if (!data.session) {

      window.location.href =
        "login.html";

      return false;
    }

    return true;
  }


  /*
   * ============================
   * MULAI DASHBOARD
   * ============================
   */

  async function mulai() {

    const login =
      await cekLogin();

    if (!login) {
      return;
    }

    await loadBerita();
  }

  mulai();

</script>

</body>
</html>
```
