.channel{padding-top:28px}.channel-head{background:#fff;border-left:5px solid #c40000;padding:20px 22px;border-radius:7px;box-shadow:0 2px 9px rgba(0,0,0,.07);margin-bottom:20px}.channel-head h1{margin:0 0 6px;font-size:30px}.channel-head p{margin:0;color:#68737e;line-height:1.5}.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.news-card{background:#fff;border-radius:7px;overflow:hidden;box-shadow:0 2px 9px rgba(0,0,0,.07);transition:.15s}.news-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.11)}.news-card a{text-decoration:none;color:inherit}.news-card img,.noimg{width:100%;height:190px;object-fit:cover;display:block;background:#e9edf1}.noimg{display:flex;align-items:center;justify-content:center;color:#8b949e}.news-body{padding:15px}.cat{font-size:11px;font-weight:800;color:#c40000;text-transform:uppercase;margin-bottom:7px}.news-body h2{font-size:18px;line-height:1.3;margin:0 0 8px}.summary{font-size:13px;line-height:1.5;color:#68737e;margin-bottom:10px}.meta{font-size:11px;color:#89929b}.empty{background:#fff;border-radius:7px;padding:40px 20px;text-align:center;color:#727b84;grid-column:1/-1}@media(max-width:900px){.news-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.channel{padding-top:16px}.channel-head{padding:16px}.channel-head h1{font-size:25px}.news-grid{grid-template-columns:1fr}.news-card img,.noimg{height:210px}}

<main class="wrap page channel"><section class="channel-head"><h1>Berita</h1><p>Berita terbaru VISI Bangsa. Hanya berita yang sudah diterbitkan yang ditampilkan kepada pembaca.</p></section><section id="newsGrid" class="news-grid"><div class="empty">Memuat berita...</div></section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabaseClient=window.supabase.createClient("https://vupvgdfdnpqactlqufbu.supabase.co","sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV",{global:{fetch:(url,options={})=>fetch(url,{...options,cache:"no-store"})}});
const grid=document.getElementById("newsGrid");
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function ringkas(v){v=String(v||"").replace(/\s+/g," ").trim();return v.length>145?v.slice(0,145)+"...":v}
function waktu(v){const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Jakarta"})}
async function load(){
 const q=supabaseClient.from("berita").select("id,judul,isi,gambar,kategori,penulis,tanggal,updated_at,status").eq("status","terbit").order("tanggal",{ascending:false});
 const r=await q;
 if(r.error){grid.innerHTML='<div class="empty">Berita belum dapat dimuat.</div>';return}
 const rows=r.data||[];
 if(!rows.length){grid.innerHTML='<div class="empty">Belum ada berita pada kanal ini.</div>';return}
 grid.innerHTML=rows.map(x=>'<article class="news-card"><a href="detail.html?id='+encodeURIComponent(x.id)+'">'+(x.gambar?'<img src="'+esc(x.gambar)+'" alt="'+esc(x.judul)+'" loading="lazy">':'<div class="noimg">VISI Bangsa</div>')+'<div class="news-body"><div class="cat">'+esc(x.kategori||"Berita")+'</div><h2>'+esc(x.judul)+'</h2><div class="summary">'+esc(ringkas(x.isi))+'</div><div class="meta">'+esc(x.penulis||"Redaksi VISI Bangsa")+' • '+esc(waktu(x.tanggal))+'</div></div></a></article>').join("");
}
load();
</script></body></html>
