<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - VISI Bangsa</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;background:#17212b;padding:20px}
.box{width:100%;max-width:420px;background:#fff;border-radius:12px;padding:30px;box-shadow:0 10px 35px rgba(0,0,0,.25)}
.logo{text-align:center;font-size:28px;font-weight:800;color:#17212b}.logo span{color:#e11d2e}.sub{text-align:center;color:#667085;margin:8px 0 24px;font-size:14px}
label{display:block;margin:15px 0 7px;font-weight:700;font-size:14px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:7px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:7px;background:#e11d2e;color:#fff;font-size:16px;font-weight:700}button:disabled{opacity:.65}#message{margin-top:15px;text-align:center;font-size:14px;min-height:20px}.back{display:block;text-align:center;margin-top:20px;color:#667085;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="box">
<div class="logo">VISI <span>Bangsa</span></div>
<div class="sub">Buat password baru untuk akun pengelola</div>
<form id="resetForm">
<label for="password">Password baru</label>
<input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="Masukkan password baru">
<label for="confirm">Ulangi password</label>
<input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="Ulangi password baru">
<button id="saveButton" type="submit">Simpan Password Baru</button>
<div id="message"></div>
</form>
<a class="back" href="./login.html">← Kembali ke Login</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=window.supabase.createClient(
 "https://vupvgdfdnpqactlqufbu.supabase.co",
 "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV"
);
const form=document.getElementById("resetForm");
const message=document.getElementById("message");
const saveButton=document.getElementById("saveButton");
form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 if(password.length<6){message.textContent="Password minimal 6 karakter.";return}
 if(password!==confirm){message.textContent="Ulangi password belum sama.";return}
 saveButton.disabled=true; message.textContent="Menyimpan password baru...";
 try{
  const {error}=await supabaseClient.auth.updateUser({password});
  if(error){console.error(error);message.textContent="Password gagal diubah. Tautan pemulihan mungkin sudah kedaluwarsa.";saveButton.disabled=false;return}
  await supabaseClient.auth.signOut();
  message.textContent="Password berhasil diubah. Silakan login kembali.";
  setTimeout(()=>window.location.replace("./login.html"),1800);
 }catch(error){console.error(error);message.textContent="Terjadi kesalahan. Silakan ulangi.";saveButton.disabled=false}
});
</script>
</body>
</html>
