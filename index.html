<header>
  <div class="header-inner">
    <div>

</header>

<nav>
  <div class="nav-inner">

    <a href="#berita">BERITA TERKINI</a>
    <a href="#nasional">NASIONAL</a>

    <a href="#ekonomi">EKONOMI</a>
    <a href="#politik">POLITIK</a>
    <a href="#olahraga">OLAHRAGA</a>
    <a href="#teknologi">TEKNOLOGI</a>
  </div>
</nav>

<main>

  <section class="headline">
    <h1>Berita Terkini</h1>
    <p>Informasi terbaru dari VISI Bangsa</p>
  </section>

  <section id="berita">
    <div id="status">Memuat berita...</div>
    <div id="daftar-berita" class="berita-grid"></div>
  </section>

</main>

<footer>
  © <span id="tahun"></span> VISI Bangsa — Media Elektronik
</footer>

<script>
  const SUPABASE_URL = "https://vupvgdfdnpqactlqufbu.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_QmG9CJHdYzwxiRRxRmdcxQ_gZi2REjV";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const statusEl = document.getElementById("status");
  const daftarEl = document.getElementById("daftar-berita");

  document.getElementById("tahun").textContent =
    new Date().getFullYear();

  function formatTanggal(tanggal) {
    if (!tanggal) return "";

    const date = new Date(tanggal);

    return date.toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "long",
      year: "numeric"
    });
  }

  function potongTeks(text, jumlah = 150) {
    if (!text) return "";

    const bersih = text.replace(/<[^>]*>/g, "").trim();

    if (bersih.length <= jumlah) {
      return bersih;
    }

    return bersih.substring(0, jumlah) + "...";
  }

  function buatBerita(item) {
    const article = document.createElement("article");
    article.className = "berita";

    let gambarHTML = "";

    if (item.gambar && item.gambar.trim() !== "") {
      gambarHTML = `
        <img
          class="gambar"
          src="${item.gambar}"
          alt="${item.judul || "Berita VISI Bangsa"}"
          loading="lazy"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >
        <div class="tanpa-gambar" style="display:none;">
          VISI Bangsa
        </div>
      `;
    } else {
      gambarHTML = `
        <div class="tanpa-gambar">
          VISI Bangsa
        </div>
      `;
    }

    article.innerHTML = `
      ${gambarHTML}

      <div class="isi">

        ${
          item.kategori
            ? `<div class="kategori">${item.kategori}</div>`
            : ""
        }

        <h2 class="judul">
          <a href="#">
            ${item.judul || "Tanpa Judul"}
          </a>
        </h2>

        <div class="ringkasan">
          ${potongTeks(item.isi)}
        </div>

        <div class="meta">
          ${item.penulis ? `Oleh ${item.penulis} · ` : ""}
          ${formatTanggal(item.tanggal || item.created_at)}
        </div>

      </div>
    `;

    return article;
  }

  async function tampilkanBerita() {
    statusEl.textContent = "Memuat berita...";
    daftarEl.innerHTML = "";

    try {
      const { data, error } = await supabaseClient
        .from("berita")
        .select("*")
        .order("tanggal", { ascending: false });

      if (error) {
        console.error("Supabase error:", error);

        statusEl.innerHTML = `
          <div class="kosong">
            <strong>Berita belum dapat dimuat.</strong>
            <br><br>
            Silakan periksa koneksi database Supabase.
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {
        statusEl.innerHTML = `
          <div class="kosong">
            Belum ada berita yang dipublikasikan.
          </div>
        `;

        return;
      }

      statusEl.style.display = "none";

      data.forEach(item => {
        daftarEl.appendChild(buatBerita(item));
      });

    } catch (error) {
      console.error(error);

      statusEl.innerHTML = `
        <div class="kosong">
          Terjadi kesalahan saat mengambil berita.
        </div>
      `;
    }
  }

  tampilkanBerita();
</script>

</body>
